name: Firmware release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION="$(sed -n 's/.*-DFIRMWARE_VERSION=\\"\([0-9.]*\)\\".*/\1/p' platformio.ini)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "FIRMWARE_VERSION not found in platformio.ini" >&2
            exit 1
          fi
          TAG="v$VERSION"
          SUBJECT="$(git log -1 --format=%s)"

          if [[ "$EVENT_NAME" != "workflow_dispatch" && ! "$SUBJECT" =~ ^v[0-9] ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "${SUBJECT%%[: ]*}" != "$TAG" ]]; then
            echo "Commit subject ${SUBJECT%%[: ]*} does not match platformio.ini $TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already released" >&2
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.version.outputs.release == 'true'
        with:
          python-version: "3.12"

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: |
          pip install platformio
          pio run -e esp32dev

      - name: Check image
        if: steps.version.outputs.release == 'true'
        run: |
          BIN=.pio/build/esp32dev/firmware.bin
          SIZE=$(stat -c %s "$BIN")
          SLOT=$((0x1E0000))
          echo "firmware.bin: $SIZE of $SLOT bytes"
          test "$SIZE" -le "$SLOT"
          grep -qa "${{ steps.version.outputs.version }}" "$BIN"

      - name: Create manifest
        if: steps.version.outputs.release == 'true'
        run: |
          SHA256="$(sha256sum .pio/build/esp32dev/firmware.bin | cut -d ' ' -f 1)"
          jq -n \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag }}/firmware.bin" \
            --arg sha256 "$SHA256" \
            '{version: $version, url: $url, sha256: $sha256}' > manifest.json

      - name: Publish
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOTES="$(awk -v t="## $TAG" 'index($0, t) == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md)"
          gh release create "$TAG" \
            .pio/build/esp32dev/firmware.bin#firmware.bin \
            manifest.json#manifest.json \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "${NOTES:-$TAG}" \
            --latest
